version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sensor_db
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sensor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  hub:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:password@db:5432/sensor_db
    depends_on:
      db:
        condition: service_healthy